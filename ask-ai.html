<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ჰკითხე AI-ს</title>

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AI ასისტენტი">

    <style>
        :root {
            --primary: #D32F2F;
            --bg: #FDFBF7;
            --text-main: #2C3E50;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh; /* Full viewport height */
        }

        header {
            background-color: white;
            border-bottom: 1px solid #E0E0E0;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: var(--primary);
            text-decoration: none;
            font-size: 16px;
            margin-right: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            color: var(--primary);
            flex-grow: 1;
            text-align: center;
            margin-right: 30px; /* Offset for back button to center text */
        }

        /* Container for the embedded AI */
        #ai-container {
            flex-grow: 1; /* Take all remaining space */
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">‹ უკან</a>
        <h1>AI ასისტენტი</h1>
    </header>

    <!-- This iframe holds the AI chatbot -->
    <iframe 
        id="ai-container"
        src="https://www.blackbox.ai/agent/GeorgianAssistantBPbZ7tJ" 
        title="Georgian AI Assistant"
        allow="clipboard-write"
    >
        თქვენს ბრაუზერს არ აქვს iframe-ის მხარდაჭერა.
    </iframe>

</body>
</html>
